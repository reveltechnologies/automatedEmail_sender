[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "email-sender"
version = "1.1.0"
description = "Send personalised emails to testers and subscribers, one message per person."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
email-sender = "email_sender.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
